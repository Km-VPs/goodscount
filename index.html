<style>
:root{
  --bg:#060a17;
  --ink:#eef3ff;
  --mute:rgba(226,235,255,.64);
  --stroke:rgba(255,255,255,.2);
  --cy:#5ee7ff;      /* active / plus  */
  --vio:#b9a4ff;     /* minus          */
  --short:#ffb547;   /* short          */
  --ok:#3df0a5;      /* match          */
  --over:#ff5d73;    /* over           */
  --dock-h:270px;
  --open-w:88px;
  --f-ui:'Prompt','Noto Sans Lao',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-family:var(--f-ui);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  min-height:100dvh;
  overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  font-size:16px;line-height:1.4;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(60vmax 60vmax at 108% -8%, rgba(94,231,255,.40), transparent 60%),
    radial-gradient(56vmax 56vmax at -18% 38%, rgba(134,92,255,.44), transparent 60%),
    radial-gradient(52vmax 52vmax at 95% 108%, rgba(255,120,172,.28), transparent 60%),
    linear-gradient(180deg,#0a1230,#070b1a 62%,#0b0f24);
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
svg{display:block}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid var(--stroke);
  box-shadow:0 10px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.26);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  border-radius:0 0 24px 24px;border-top:0;
}
.mark{flex:none;width:40px;height:40px}
.mark svg{width:100%;height:100%}
.brand{flex:1;min-width:0;text-align:left}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;white-space:nowrap;line-height:1.25}
.brand button{display:block;max-width:100%;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.icon-btn{
  flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1px solid var(--stroke);
}
.icon-btn:active{transform:scale(.94);background:rgba(255,255,255,.2)}
.top.glass,.dock.glass{background:linear-gradient(135deg,rgba(44,58,122,.80),rgba(14,20,50,.88))}

main{padding:12px 12px calc(var(--dock-h) + 28px)}

/* ---------- summary ---------- */
.sum{border-radius:26px;padding:16px 16px 14px}
.sum-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum-big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sum-of{font-size:19px;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.sum-unit{margin-left:auto;font-size:14px;color:var(--mute)}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--cy),var(--ok));transition:width .3s ease}
.sum-sub{font-size:15px;color:var(--mute);min-height:22px}
.sum-sub.good{color:var(--ok)}
.sum-sub.warn{color:var(--over)}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:42px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:500;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--mute);
  display:flex;align-items:center;gap:8px;
}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink)}
.chip.on{background:rgba(94,231,255,.2);border-color:rgba(94,231,255,.7);color:var(--ink)}

/* ---------- add button ---------- */
.addbtn{
  width:100%;height:68px;margin:12px 0;border-radius:24px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:23px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,rgba(94,231,255,.5),rgba(70,120,255,.34));
  border:1px solid rgba(160,240,255,.65);
  box-shadow:0 12px 32px rgba(40,140,255,.28),inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.addbtn:active{transform:scale(.98);filter:brightness(1.2)}

/* ---------- list ---------- */
#list{list-style:none;margin:0;padding:0}
.row{position:relative;margin-bottom:10px;border-radius:24px;overflow:hidden}
.del{
  position:absolute;left:0;top:0;bottom:0;width:calc(var(--open-w) + 24px);border-radius:24px;padding-right:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:14px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,rgba(255,93,115,.85),rgba(255,93,115,.5));
  opacity:0;transition:opacity .15s;
}
.row.open .del,.row.peek .del{opacity:1}
.del:active{filter:brightness(1.2)}
.front{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:10px;
  min-height:86px;padding:10px 12px 10px 14px;border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  border:1px solid var(--stroke);
  box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.24);
  touch-action:pan-y;
  transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;
}
.row.open .front{transform:translateX(var(--open-w))}
.front.dragging{transition:none}
.row.active .front{
  border-color:var(--cy);
  background:linear-gradient(135deg,rgba(94,231,255,.26),rgba(255,255,255,.07));
  box-shadow:0 0 0 1px var(--cy),0 0 30px rgba(94,231,255,.36),inset 0 1px 0 rgba(255,255,255,.3);
}
.radio{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center}
.row.active .radio{border-color:var(--cy)}
.row.active .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
.info{flex:1;min-width:0}
.name{font-size:18px;font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--mute)}
.tag{padding:1px 8px;border-radius:8px;font-weight:600;font-size:13px}
.tag.short{background:rgba(255,181,71,.18);color:var(--short)}
.tag.ok{background:rgba(61,240,165,.18);color:var(--ok)}
.tag.over{background:rgba(255,93,115,.2);color:#ff8d9c}
.tag.none{background:rgba(255,255,255,.1);color:var(--mute)}
.cnt{
  flex:none;min-width:50px;height:56px;padding:0 4px;border-radius:14px;
  font-size:32px;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums;
}
.st-ok .cnt{color:var(--ok)}
.st-over .cnt{color:var(--over)}
.cnt.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.28)}}
.rbs{flex:none;display:flex;gap:8px}
.rb{width:46px;height:46px;border-radius:16px;font-size:30px;font-weight:500;line-height:1;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28)}
.rb.minus{background:rgba(185,164,255,.26)}
.rb.plus{background:rgba(94,231,255,.30)}
.rb:active{transform:scale(.9);filter:brightness(1.3)}
.row.hit .front{animation:hit .7s ease-out}
.row.hitover .front{animation:hitover .7s ease-out}
@keyframes hit{30%{box-shadow:0 0 0 3px var(--ok),0 0 40px rgba(61,240,165,.7)}}
@keyframes hitover{30%{box-shadow:0 0 0 3px var(--over),0 0 40px rgba(255,93,115,.7)}}

.empty{text-align:center;padding:30px 20px;color:var(--mute);font-size:16px;border-radius:24px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.empty button{margin-top:16px;height:48px;padding:0 20px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.1);color:var(--ink);font-size:16px}

/* ---------- dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-radius:30px 30px 0 0;border-bottom:0;
}
.now{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  padding:8px 14px;border-radius:18px;min-height:58px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
}
.now .lab{font-size:12px;color:var(--cy)}
.now .nm{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.now .txt{flex:1;min-width:0}
.now .num{flex:none;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.now .num span{font-size:18px;color:var(--mute);font-weight:500}
.dock.idle .now .nm{color:var(--mute);font-weight:500;font-size:17px}
.dock.idle .now .lab{display:none}
.now.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tools{display:flex;align-items:center;gap:10px;margin:10px 0}
.seg{display:flex;flex:1;gap:6px;padding:4px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.seg button{flex:1;height:38px;border-radius:12px;font-size:16px;font-weight:600;color:var(--mute)}
.seg button.on{background:rgba(94,231,255,.26);color:#fff;box-shadow:inset 0 0 0 1px rgba(94,231,255,.7)}
.undo{height:48px;padding:0 16px;border-radius:16px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid var(--stroke)}
.undo[disabled]{opacity:.35}
.undo:not([disabled]):active{transform:scale(.95)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{
  height:clamp(104px,18vh,170px);border-radius:30px;
  display:grid;place-items:center;font-size:68px;font-weight:500;line-height:1;color:#fff;
  border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 30px rgba(0,0,0,.3);
  touch-action:manipulation;
  font-family:system-ui,'Prompt',sans-serif;
}
.big.minus{background:linear-gradient(160deg,rgba(185,164,255,.5),rgba(120,80,255,.24));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 32px rgba(130,90,255,.28)}
.big.plus{background:linear-gradient(160deg,rgba(94,231,255,.52),rgba(40,120,255,.26));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 32px rgba(40,160,255,.3)}
.big:active{transform:scale(.97);filter:brightness(1.3)}
.dock.idle .big{opacity:.55}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--dock-h) + 12px);z-index:40;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px);
  padding:10px 12px 10px 18px;border-radius:18px;font-size:16px;
  transition:opacity .2s,transform .2s;
  background:linear-gradient(135deg,rgba(44,58,122,.92),rgba(14,20,50,.95));
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:38px;padding:0 14px;border-radius:12px;background:rgba(94,231,255,.28);font-weight:600;white-space:nowrap}

/* ---------- sheet ---------- */
.wrap{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
  background:rgba(3,6,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.wrap.show{display:flex}
.sheet{
  width:100%;max-height:92dvh;overflow:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius:30px 30px 0 0;border:1px solid var(--stroke);border-bottom:0;
  background:linear-gradient(160deg,rgba(40,52,110,.90),rgba(18,24,58,.95));
  animation:up .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-title{font-size:22px;font-weight:700;margin-bottom:14px;line-height:1.35}
.sheet label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
.sheet label small{opacity:.8}
.sheet input[type=text],.sheet textarea{
  display:block;width:100%;margin-top:6px;font:inherit;font-size:20px;color:var(--ink);
  padding:14px 16px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.08);
  -webkit-user-select:text;user-select:text;
}
.sheet textarea{resize:none;font-size:18px}
.sheet ::placeholder{color:rgba(226,235,255,.35)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sh-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:8px}
.btn{height:58px;border-radius:18px;font-size:18px;font-weight:600;border:1px solid var(--stroke);background:rgba(255,255,255,.1);color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,rgba(94,231,255,.55),rgba(70,120,255,.4));border-color:rgba(160,240,255,.7)}
.btn.danger{background:rgba(255,93,115,.25);border-color:rgba(255,93,115,.7)}
.btn:active{transform:scale(.97);filter:brightness(1.2)}
.sheet .seg{margin-bottom:14px}
.prev{font-size:14px;color:var(--mute);max-height:140px;overflow:auto;margin:-2px 0 12px;-webkit-user-select:text;user-select:text}
.prev div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.prev b{color:var(--cy);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:10px;margin-top:6px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:17px;text-align:left}
.pill{flex:none;width:56px;height:32px;border-radius:20px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.pill.on{background:rgba(61,240,165,.7)}
.pill.on::after{transform:translateX(24px)}
.sec{margin:16px 0 8px;font-size:14px;color:var(--mute)}
.seg.lang button{font-size:17px;height:44px}
.fontlist{display:grid;gap:8px}
.fopt{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);text-align:left;width:100%}
.fopt.on{border-color:var(--cy);background:rgba(94,231,255,.16);box-shadow:inset 0 0 0 1px var(--cy)}
.fopt[disabled]{opacity:.45}
.fopt .fn{flex:1;min-width:0}
.fopt .fn b{display:block;font-size:16px;font-weight:600;font-family:system-ui,sans-serif}
.fopt .fn span{display:block;font-size:20px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fopt .fn i{display:block;font-style:normal;font-size:12px;color:var(--short);font-family:system-ui,sans-serif}
.fopt .tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.fopt.on .tick{border-color:var(--cy);background:var(--cy);box-shadow:inset 0 0 0 4px #0c1330}
.help{margin-top:16px;font-size:14px;color:var(--mute);line-height:1.8}
.rep-group{margin:0 0 14px}

.rep-item span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rep-meta{font-size:14px;color:var(--mute);margin:-8px 0 14px}
.sh-actions.three{grid-template-columns:1fr 1fr 1fr}
.sh-actions.three .btn{font-size:16px}
.about{text-align:center;padding-top:4px}
.about-logo{width:96px;height:96px;margin:0 auto 10px}
.about-logo svg{width:100%;height:100%}
.about h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.2px}
.about .tg{margin:6px 0 2px;font-size:17px}
.about .fam,.about .ver{margin:2px 0;font-size:14px;color:var(--mute)}
.about ul{list-style:none;margin:8px 0 0;padding:0;text-align:left;font-size:14px;color:var(--mute);line-height:1.9}
.about h3{margin:18px 0 0;font-size:14px;color:var(--mute);text-align:left;font-weight:500}
.top{gap:8px}
.icon-btn svg{width:24px;height:24px}
@media (max-width:370px){ .mark{display:none} }
.tag.pk{background:rgba(94,231,255,.16);color:var(--cy)}
.tag.cur{background:rgba(94,231,255,.22);color:var(--cy)}
.now .num .u{font-size:15px}
.sheet input[type=search]{

.unitchips::-webkit-scrollbar{display:none}
.uchip{flex:none;height:40px;padding:0 14px;border-radius:12px;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--mute)}
.uchip.on{background:rgba(94,231,255,.2);border-color:rgba(94,231,255,.7);color:var(--ink)}
.trow small{display:block;font-size:13px;color:var(--mute);margin-top:1px}
.lbl{font-size:14px;color:var(--mute);margin:12px 2px 6px}
.sheet .seg.tight{margin-bottom:4px}
.range{display:flex;align-items:center;gap:12px;padding:4px 4px 0}
.range input{flex:1;height:36px;accent-color:var(--cy)}
.range b{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mute);margin:6px 2px 0;line-height:1.6}
.hint.warn{color:var(--short)}
.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tests button{height:46px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--stroke);font-size:15px;font-weight:600}
.tests button:active{transform:scale(.95);background:rgba(94,231,255,.25)}
.hday{font-size:13px;color:var(--mute);margin:14px 4px 6px}
.hcard{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}

.hcard .h1 span:last-child{flex:none;font-size:14px;font-weight:500;color:var(--mute)}
.hcard .h2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:14px;color:var(--mute)}
.hempty{text-align:center;color:var(--mute);padding:26px 10px}
.imgprev{display:grid;gap:10px;max-height:48dvh;overflow:auto;margin:4px 0 8px;padding:8px;border-radius:16px;background:rgba(255,255,255,.06)}

.sh-actions.one{grid-template-columns:1fr}
.sh-actions.even{grid-template-columns:1fr 1fr}

</header>

<main>

</main>

<div class="toast glass" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden></button></div>

<nav class="dock glass idle" id="dock">

    <div class="txt"><div class="lab" id="nowLab"></div><div class="nm" id="nowName"></div></div>
    <div class="num" id="nowCnt"></div>
  </button>
  <div class="tools">
    <div class="seg" id="steps" role="group"></div>
    <button class="undo" id="undo" type="button" disabled></button>
  </div>
  <div class="pads">
    <button class="big minus" id="bMinus" type="button">−</button>
    <button class="big plus" id="bPlus" type="button">+</button>
  </div>
</nav>

const KEY = 'vector-goodscount-v1', OLD_KEY = 'vector-stockcount-v1';
const OPEN_W = 88;
function detectLang(){
  const l = (navigator.language || '').toLowerCase();
  return l.startsWith('lo') ? 'lo' : l.startsWith('th') ? 'th' : 'en';
}
const defaults = () => ({
  billId:uid(), bill:'', party:'', plate:'', dir:'', note:'', createdAt:Date.now(), updatedAt:Date.now(),
  items:[], activeId:null, step:1, filter:'all',
  sound:true, soundStyle:'beep', volume:70, vibrate:true, vibLevel:2, mile:10,
  lang:detectLang(), laoFont:'noto', units:[], imgCols:1, imgSort:'prob', lastBackup:0
});
let S = load();
function load(){
  for (const k of [KEY, OLD_KEY]) {
    try{
      const r = JSON.parse(localStorage.getItem(k));
      if (r && Array.isArray(r.items)) {
        const s = Object.assign(defaults(), r);
        if (!s.items.some(i => i.id === s.activeId)) s.activeId = null;
        if (![1,5,10,'p'].includes(s.step)) s.step = 1;
        if (!T[s.lang]) s.lang = detectLang();
        if (!FONTS[s.laoFont]) s.laoFont = 'noto';
        if (!SND_STYLES.includes(s.soundStyle)) s.soundStyle = 'beep';
        if (![1,2,3,4].includes(s.vibLevel)) s.vibLevel = 2;
        if (![0,5,10,20].includes(s.mile)) s.mile = 10;
        if (![1,2,3].includes(s.imgCols)) s.imgCols = 1;
        if (!Array.isArray(s.units)) s.units = [];
        return s;
      }
    }catch(e){}
  }
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
/* call after any change to the bill itself: saves now and copies it into History */
function dirty(){ S.updatedAt = Date.now(); save(); schedulePersist(); }
const find = id => S.items.find(i => i.id === id);
const statusOf = it => it.target == null ? 'none' : it.count < it.target ? 'short' : it.count === it.target ? 'ok' : 'over';

function t(k, v){
  let s = (T[S.lang] && T[S.lang][k]) ?? T.en[k] ?? k;
  if (v) for (const x in v) s = s.split('{'+x+'}').join(v[x]);
  return s;
}

/* ================= history storage (IndexedDB, falls back to localStorage) ================= */
const DB = (() => {
  const LSH = 'vector-goodscount-history';
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) { rej(new Error('no indexedDB')); return; }
    const r = indexedDB.open('goodscount', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('bills', {keyPath:'id'});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }).catch(() => null));
  const lsAll = () => { try{ return JSON.parse(localStorage.getItem(LSH)) || {}; }catch(e){ return {}; } };
  const lsSet = m => { localStorage.setItem(LSH, JSON.stringify(m)); };
  const run = (db, mode, fn) => new Promise((res, rej) => {
    const tx = db.transaction('bills', mode), req = fn(tx.objectStore('bills'));
    tx.oncomplete = () => res(req.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
  return {
    async put(b){ const db = await open(); if (!db) { const m = lsAll(); m[b.id] = b; lsSet(m); return; } await run(db, 'readwrite', s => s.put(b)); },
    async get(id){ const db = await open(); if (!db) return lsAll()[id] || null; return (await run(db, 'readonly', s => s.get(id))) || null; },
    async all(){ const db = await open(); if (!db) return Object.values(lsAll()); return (await run(db, 'readonly', s => s.getAll())) || []; },
    async del(id){ const db = await open(); if (!db) { const m = lsAll(); delete m[id]; lsSet(m); return; } await run(db, 'readwrite', s => s.delete(id)); }
  };
})();

const curBill = () => ({id:S.billId, bill:S.bill, party:S.party, plate:S.plate, dir:S.dir, note:S.note,
  items:JSON.parse(JSON.stringify(S.items)), createdAt:S.createdAt, updatedAt:S.updatedAt});
const isBlank = b => !b.items.length && !b.bill && !b.party && !b.plate && !b.note;

/* every DB write goes through one queue, so they land in order */
let dbChain = Promise.resolve(), persistT = null, askedPersist = false;
const dbq = fn => (dbChain = dbChain.then(fn).catch(() => {}));
function schedulePersist(){ clearTimeout(persistT); persistT = setTimeout(persistNow, 400); }
function persistNow(){
  clearTimeout(persistT); persistT = null;
  const b = curBill();
  if (!askedPersist && navigator.storage && navigator.storage.persist) {
    askedPersist = true;
    navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
  }
  return dbq(() => isBlank(b) ? DB.del(b.id) : DB.put(b));
}
const flush = () => { if (persistT) persistNow(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

/* undo */
const undoStack = [];
function snap(){
  undoStack.push(JSON.stringify({items:S.items, activeId:S.activeId}));
  if (undoStack.length > 80) undoStack.shift();
  $('#undo').disabled = false;
}
function undo(){
  const s = undoStack.pop();
  if (!s) return;
  const o = JSON.parse(s);
  S.items = o.items; S.activeId = o.activeId; openId = null;
  $('#undo').disabled = !undoStack.length;
  dirty(); render(); toast(t('undone')); fb('down');
}

/* ================= feedback (haptic + sound) ================= */
const NOTES = {
  up:[[880,0,.05]], down:[[440,0,.06]], mile:[[1175,0,.06],[1175,.11,.06]],
  hit:[[988,0,.07],[1319,.09,.12]], over:[[196,0,.12],[196,.16,.12]], err:[[150,0,.1]]
};
let AC = null;
function beep(kind){
  try{
    const vol = Math.pow((S.volume ?? 70) / 100, 1.6) * .5;
    if (vol <= 0.001) return;
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const tm = AC.currentTime + .005, st = S.soundStyle, harsh = kind === 'over' || kind === 'err';
    const tone = (f, d, len, type, peak, sweep) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(sweep ? f * 1.8 : f, tm + d);
      if (sweep) o.frequency.exponentialRampToValueAtTime(f, tm + d + len * .6);
      g.gain.setValueAtTime(.0001, tm + d);
      g.gain.exponentialRampToValueAtTime(peak, tm + d + .006);
      g.gain.exponentialRampToValueAtTime(.0001, tm + d + len);
      o.connect(g).connect(AC.destination);
      o.start(tm + d); o.stop(tm + d + len + .03);
    };
    NOTES[kind].forEach(([f, d, l]) => {
      const peak = harsh ? vol * .7 : vol;
      if (st === 'click')     tone(harsh ? f : f * 2, d, harsh ? l : .02, 'square', peak * .7);
      else if (st === 'pop')  tone(f, d, Math.max(l, .08), harsh ? 'triangle' : 'sine', peak, true);
      else if (st === 'bell') { tone(f, d, l * 4 + .1, harsh ? 'sawtooth' : 'triangle', peak); if (!harsh) tone(f * 2.76, d, l * 2 + .05, 'sine', peak * .25); }
      else                    tone(f, d, l, harsh ? 'sawtooth' : 'sine', peak);
    });
  }catch(e){}
}

/* vibration patterns: [on, off, on, …] in ms. Each event feels different, so you can count without looking */
const VIB = {up:[18], down:[12,60,12], mile:[45,70,45], hit:[260], over:[110,70,110,70,110], err:[30,40,30,40,30]};
const VLV = [0, .55, 1, 1.6, 2.3];
let iosSw = null;
function iosTick(){   /* iOS Safari has no vibrate(); toggling a native switch gives a light tap (iOS 18+) */
  try{
    if (!iosSw) {
      iosSw = document.createElement('label'); iosSw.setAttribute('aria-hidden','true'); iosSw.dataset.hap = '1'; iosSw.style.display = 'none';
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch',''); iosSw.appendChild(i);
      document.body.appendChild(iosSw);
    }
    iosSw.click();
  }catch(e){}
}
function vib(kind){
  const p = VIB[kind]; if (!p) return;
  const k = VLV[S.vibLevel] || 1;
  if (navigator.vibrate) { navigator.vibrate(p.map((d, i) => Math.round(i % 2 ? d * Math.max(1, k * .8) : d * k))); return; }
  if (isIOS) { let at = 0; p.forEach((d, i) => { if (i % 2 === 0) setTimeout(iosTick, at); at += d; }); }
}
function fb(kind){
  if (S.vibrate) vib(kind);
  if (S.sound) beep(kind);
}

/* ================= counting ================= */
function changeCount(id, delta){
  const it = find(id);
  if (!it) return;
  const prev = it.count, next = Math.max(0, prev + delta);
  if (next === prev) { fb('err'); nudge(); return; }
  const before = statusOf(it);
  snap();
  it.count = next;
  const after = statusOf(it);
  openId = null;
  let kind = delta > 0 ? 'up' : 'down', flash = null;
  if (after === 'ok' && before !== 'ok')          { kind = 'hit';  flash = 'hit'; }
  else if (after === 'over' && before !== 'over') { kind = 'over'; flash = 'hitover'; }
  else if (after === 'over' && delta > 0)         { kind = 'over'; }   // still adding past the Bill: keep warning
  else if (delta > 0 && S.mile && Math.floor(next / S.mile) > Math.floor(prev / S.mile)) kind = 'mile';
  fb(kind);
  dirty();
  render({id, flash});
}
function setActive(id){
  if (S.activeId === id) return;
  S.activeId = id; save(); render();
  if (S.vibrate && navigator.vibrate) navigator.vibrate(8);
}
const packOf = it => it && it.pack > 1 ? it.pack : 0;
function stepVal(){
  if (S.step === 'p') return packOf(find(S.activeId)) || 1;
  return S.step;
}
function press(dir){
  if (!find(S.activeId)) { fb('err'); nudge(); return; }
  changeCount(S.activeId, dir * stepVal());
}
function nudge(){
  const n = $('#now'); n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake');
}
function deleteItem(id){
  const it = find(id); if (!it) return;
  snap();
  S.items = S.items.filter(i => i.id !== id);
  if (S.activeId === id) S.activeId = null;
  openId = null; dirty(); render();
  toast(t('deleted', {name:it.name}), {label:t('undo'), fn:undo});
  fb('down');
}

/* ================= render ================= */
let openId = null;
const matchFilter = it => S.filter === 'all' || statusOf(it) === S.filter;

function calc(items){
  const r = {counted:0, target:0, hasT:false, short:0, ok:0, over:0, none:0, got:0};
  (items || S.items).forEach(it => {
    r.counted += it.count;
    const st = statusOf(it); r[st]++;
    if (st !== 'none') { r.hasT = true; r.target += it.target; r.got += Math.min(it.count, it.target); }
  });
  return r;
}

function billLineText(){
  const parts = [];
  if (S.bill) parts.push(`${t('billWord')} ${S.bill}`);
  if (S.party) parts.push(S.party);
  if (S.plate) parts.push(S.plate);
  return parts.length ? (DIR_ICON[S.dir] || '') + parts.join(' · ') : t('billPrompt');
}

function renderSummary(){
  const r = calc();
  $('#sCnt').textContent = r.counted;
  $('#sTgt').textContent = r.hasT ? t('ofBill', {n:r.target}) : (S.items.length ? t('counted') : '');
  $('#sItems').textContent = S.items.length ? t('items', {n:S.items.length}) : '';
  const pct = r.hasT && r.target ? Math.round(r.got / r.target * 100) : 0;
  $('#sBar').style.width = pct + '%';
  $('#sBarWrap').hidden = !r.hasT;
  const sub = $('#sSub'); sub.className = 'sum-sub';
  if (!S.items.length) sub.textContent = t('sub0');
  else if (!r.hasT)    sub.textContent = t('subNoBill');
  else if (r.short === 0 && r.over === 0 && r.ok > 0) { sub.textContent = t('subAllOk'); sub.classList.add('good'); }
  else {
    const parts = [];
    if (r.over)  parts.push(t('subOver', {n:r.over}));

    sub.textContent = parts.join(t('and'));
    if (r.over) sub.classList.add('warn');
  }
  const chips = [['all',t('fAll'),S.items.length]];
  if (r.hasT) chips.push(['short',t('fShort'),r.short],['ok',t('fOk'),r.ok],['over',t('fOver'),r.over]);
  if (!chips.some(c => c[0] === S.filter)) S.filter = 'all';
  $('#chips').innerHTML = chips.map(([k,l,n]) =>
    `<button type="button" class="chip${S.filter===k?' on':''}" data-f="${k}">${esc(l)} <b>${n}</b></button>`).join('');
  updateBillLine();
}

function rowHTML(it){
  const st = statusOf(it), act = it.id === S.activeId, open = it.id === openId;
  const u = it.unit ? ' ' + esc(it.unit) : '';

  if (st === 'none') meta = `<span class="tag none">${esc(t('tNone'))}</span>${u ? `<span>${u}</span>` : ''}`;
  else {
    const d = it.count - it.target;
    meta = `<span>${esc(t('bill', {n:it.target}))}${u}</span>` + (
      st === 'short' ? `<span class="tag short">${esc(t('tShort',{n:-d}))}</span>` :
      st === 'ok'    ? `<span class="tag ok">${esc(t('tOk'))}</span>` :
                       `<span class="tag over">${esc(t('tOver',{n:d}))}</span>`);
  }
  if (packOf(it)) meta += `<span class="tag pk">📦×${it.pack}</span>`;
  return `<li class="row st-${st}${act?' active':''}${open?' open':''}" data-id="${it.id}">
    <button class="del" type="button" data-act="del" aria-label="${esc(t('delAria',{name:it.name}))}">${ICON.trash}<span>${esc(t('del'))}</span></button>
    <div class="front">

        <button class="rb minus" type="button" data-act="dec" aria-label="${esc(t('decAria'))}">−</button>
        <button class="rb plus" type="button" data-act="inc" aria-label="${esc(t('incAria'))}">+</button>
      </div>
    </div>
  </li>`;
}

function renderList(b){

const SIZE_UNIT = /^(ml|cc|l|lt|ltr|g|gr|kg|mg|oz|lb|cm|mm|m|in|มล\.?|ซีซี|ลิตร|กรัม|ก\.|กก\.?|ซม\.?|มม\.?|นิ้ว|ມລ\.?|ລິດ|ກຣາມ|ກກ\.?|ກິໂລ)$/i;
function parseBulk(text){
  const out = [];
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const m = line.replace(/[๐-๙]/g, c => THAI.indexOf(c)).match(/^(.*\S)[\s:：,xX×*\-–=]+(\d+)\s*([^\d\s]{0,12})$/);
    // "Water 600ml" is a size, not a quantity
    if (m && !(m[3] && SIZE_UNIT.test(m[3]))) out.push({name:line.slice(0, m[1].length).trim(), target:parseInt(m[2],10), unit:m[3] || ''});
    else out.push({name:line, target:null, unit:''});
  });
  return out;
}

  col:{short:'#c2410c', ok:'#047857', over:'#b91c1c', none:'#64748b'},
  bg:{short:'#ffedd5', ok:'#d1fae5', over:'#fee2e2', none:'#f1f5f9'},
  row:{short:'#fff9f2', over:'#fff5f5'}};
// canvas size limits: iPhone/iPad Safari allows ~16.7 million pixels per canvas
const MAX_AREA = isIOS ? 16.7e6 : 60e6, MAX_DIM = isIOS ? 16000 : 32000;
const SEG = (() => { try { return new Intl.Segmenter(undefined, {granularity:'word'}); } catch(e){ return null; } })();
const pieces = s => SEG ? Array.from(SEG.segment(s), x => x.segment) : (s.match(/\s+|\S\p{M}*/gu) || []);
function wrapText(ctx, text, maxW, maxLines){
  const out = []; let line = '';
  const push = () => { out.push(line.trim()); line = ''; };
  for (const p of pieces(String(text))) {
    if (ctx.measureText(line + p).width <= maxW) { line += p; continue; }
    if (line.trim()) push();
    if (/^\s+$/.test(p)) continue;
    if (ctx.measureText(p).width <= maxW) { line = p; continue; }
    for (const ch of p.match(/[^]\p{M}*/gu)) { if (line && ctx.measureText(line + ch).width > maxW) push(); line += ch; }
  }
  if (line.trim()) push();
  if (out.length > maxLines) {
    const keep = out.slice(0, maxLines); let last = keep[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    keep[maxLines - 1] = last + '…';
    return keep;
  }
  return out.length ? out : [''];
}
const fit = (ctx, s, w) => wrapText(ctx, s, w, 1)[0];
function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

  const order = {short:0, over:1, ok:2, none:3};
  const items = b.items.map((it, i) => ({it, i, st:statusOf(it)}));
  if (sort === 'prob') items.sort((a, z) => order[a.st] - order[z.st] || a.i - z.i);

  const PAD = 32, GAP = 28, COLW = {1:700, 2:560, 3:540}[cols];

  const st = calc(b.items);
  const info = [b.dir ? DIR_ICON[b.dir] + t(b.dir === 'in' ? 'dirIn' : 'dirOut') : '', b.party, b.plate].filter(Boolean).join('  ·  ');
  const H_BAND = 112, H_INFO = 30 + (b.note ? 28 : 0), H_STATS = 72, H_HEAD = 40, HF = 56;
  const H0 = H_BAND + 18 + H_INFO + 14 + H_STATS + 20 + H_HEAD;

  // scale: as sharp as possible, within what the phone can make
  const sMax = {1:3, 2:2.2, 3:1.6}[cols], sMin = {1:2, 2:1.6, 3:1.3}[cols];
  const total = rows.reduce((a, r) => a + r.h, 0);
  const estH = H0 + HF + total / cols + 60;
  const s = Math.max(sMin, Math.min(sMax, Math.sqrt(MAX_AREA / (W * estH)), MAX_DIM / estH));
  const capBody = Math.max(300, Math.min(MAX_DIM, MAX_AREA / (W * s)) * .95 / s - H0 - HF);

  // split rows into pages, then balance each page across the columns
  const pages = [];
  for (let i = 0; i < rows.length || !pages.length;) {
    let j = i, sum = 0;
    while (j < rows.length && sum + rows[j].h <= cols * capBody) { sum += rows[j].h; j++; }
    if (j === i && i < rows.length) { sum = rows[i].h; j = i + 1; }
    const target = sum / cols, colsArr = [[]]; let ch = 0;
    rows.slice(i, j).forEach(r => {
      if (colsArr.length < cols && ch > 0 && (ch + r.h / 2 > target || ch + r.h > capBody)) { colsArr.push([]); ch = 0; }
      colsArr[colsArr.length - 1].push(r); ch += r.h;
    });
    pages.push(colsArr);
    if (j === i) break;
    i = j;
  }

  const now = Date.now();
  return pages.map((page, pi) => {
    const bodyH = Math.max(80, ...page.map(c => c.reduce((a, r) => a + r.h, 0)));
    const H = H0 + bodyH + HF;
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * s); cv.height = Math.round(H * s);
    const ctx = cv.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

    // header band
    ctx.fillStyle = IMG.head; ctx.fillRect(0, 0, W, H_BAND);
    const gr = ctx.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, '#5ee7ff'); gr.addColorStop(1, '#3df0a5');
    ctx.fillStyle = gr; ctx.fillRect(0, H_BAND - 5, W, 5);
    ctx.textAlign = 'left'; ctx.fillStyle = '#5ee7ff'; ctx.font = `600 18px ${F}`; ctx.fillText('GoodsCount', PAD, 30);
    ctx.fillStyle = '#fff'; ctx.font = `700 34px ${F}`;
    ctx.fillText(fit(ctx, b.bill ? `${t('repBill')} ${b.bill}` : t('noBillShort'), W - PAD * 2 - 260), PAD, 72);
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.78)'; ctx.font = `500 18px ${F}`;
    ctx.fillText(fmtDT(b.updatedAt), W - PAD, 30);
    ctx.fillStyle = '#fff'; ctx.font = `600 22px ${F}`;
    ctx.fillText(t('items', {n:b.items.length}) + (pages.length > 1 ? '  ·  ' + t('page', {a:pi + 1, b:pages.length}) : ''), W - PAD, 72);

    // info + totals
    let y = H_BAND + 18 + 15;
    const tot = t('totals', {c:st.counted, b:st.hasT ? st.target : '—'});
    ctx.font = `700 20px ${F}`; ctx.fillStyle = IMG.ink; ctx.textAlign = 'right'; ctx.fillText(tot, W - PAD, y);
    const totW = ctx.measureText(tot).width;
    ctx.textAlign = 'left'; ctx.font = `500 19px ${F}`;
    if (info) ctx.fillText(fit(ctx, info, W - PAD * 2 - totW - 24), PAD, y);
    if (b.note) { y += 28; ctx.fillStyle = IMG.mute; ctx.font = `400 17px ${F}`; ctx.fillText(fit(ctx, `${t('note')}: ${b.note}`, W - PAD * 2), PAD, y); }

    // status boxes
    y = H_BAND + 18 + H_INFO + 14;
    const boxes = [['ok', t('gOk'), st.ok], ['short', t('gShort'), st.short], ['over', t('gOver'), st.over], ['none', t('tNone'), st.none]];
    const bw = (W - PAD * 2 - 3 * 12) / 4;
    boxes.forEach(([k, label, n], i) => {
      const x = PAD + i * (bw + 12);
      ctx.fillStyle = IMG.bg[k]; rr(ctx, x, y, bw, H_STATS, 14); ctx.fill();
      ctx.fillStyle = IMG.col[k]; ctx.textAlign = 'left';
      ctx.font = `600 16px ${F}`; ctx.fillText(fit(ctx, label, bw - 70), x + 16, y + H_STATS / 2);
      ctx.font = `700 34px ${F}`; ctx.textAlign = 'right'; ctx.fillText(String(n), x + bw - 16, y + H_STATS / 2);
    });

    // columns
    const yHead = H0 - H_HEAD;
    page.forEach((col, ci) => {
      const x0 = PAD + ci * (COLW + GAP);
      ctx.fillStyle = IMG.mute; ctx.font = `600 15px ${F}`;
      const hy = yHead + H_HEAD / 2;
      ctx.textAlign = 'right'; ctx.fillText('#', x0 + 38, hy);
      ctx.textAlign = 'left'; ctx.fillText(t('colItem'), x0 + NAME_X, hy);
      ctx.textAlign = 'right'; ctx.fillText(t('colCount'), x0 + X_CNT, hy); ctx.fillText(t('colBill'), x0 + X_BILL, hy);
      ctx.textAlign = 'center'; ctx.fillText(t('colResult'), x0 + COLW - 58, hy);
      ctx.fillStyle = IMG.ink; ctx.fillRect(x0, H0 - 2, COLW, 2);
      let ry = H0;
      col.forEach((r, k) => {
        const {it, h} = r, sx = r.st;
        ctx.fillStyle = IMG.row[sx] || (k % 2 ? IMG.zebra : '#fff'); ctx.fillRect(x0, ry, COLW, h);
        ctx.fillStyle = IMG.line; ctx.fillRect(x0, ry + h - 1, COLW, 1);
        if (sx !== 'none') { ctx.fillStyle = IMG.col[sx]; ctx.fillRect(x0, ry, 4, h - 1); }
        ctx.fillStyle = IMG.mute; ctx.font = `500 15px ${F}`; ctx.textAlign = 'right'; ctx.fillText(String(r.no), x0 + 38, ry + 14 + 14.5);
        ctx.fillStyle = IMG.ink; ctx.font = `600 21px ${F}`; ctx.textAlign = 'left';
        r.lines.forEach((ln, li) => ctx.fillText(ln, x0 + NAME_X, ry + 14 + 14.5 + li * 29));
        if (r.meta) { ctx.fillStyle = IMG.mute; ctx.font = `400 15px ${F}`; ctx.fillText(r.meta, x0 + NAME_X, ry + 14 + r.lines.length * 29 + 10); }
        const cy = ry + h / 2;
        ctx.textAlign = 'right';
        ctx.fillStyle = sx === 'none' ? IMG.ink : IMG.col[sx]; ctx.font = `700 26px ${F}`; ctx.fillText(String(it.count), x0 + X_CNT, cy);
        ctx.fillStyle = IMG.mute; ctx.font = `500 22px ${F}`; ctx.fillText(it.target == null ? '—' : String(it.target), x0 + X_BILL, cy);
        const label = sx === 'short' ? t('tShort', {n:it.target - it.count}) : sx === 'ok' ? t('tOk') : sx === 'over' ? t('tOver', {n:it.count - it.target}) : '—';
        ctx.fillStyle = IMG.bg[sx]; rr(ctx, x0 + COLW - 112, cy - 18, 108, 36, 12); ctx.fill();
        ctx.fillStyle = IMG.col[sx]; ctx.font = `700 17px ${F}`; ctx.textAlign = 'center'; ctx.fillText(fit(ctx, label, 100), x0 + COLW - 58, cy);
        ry += h;
      });
      if (ci > 0) { ctx.fillStyle = IMG.line; ctx.fillRect(x0 - GAP / 2, yHead, 1, bodyH + H_HEAD); }
    });

    // footer
    const fy = H - HF;
    ctx.fillStyle = IMG.line; ctx.fillRect(PAD, fy + 8, W - PAD * 2, 1);
    ctx.fillStyle = IMG.mute; ctx.font = `400 15px ${F}`; ctx.textAlign = 'left';
    ctx.fillText(`${t('madeWith')}  ·  ${fmtDT(now)}`, PAD, fy + 32);
    if (pages.length > 1) { ctx.textAlign = 'right'; ctx.fillText(t('page', {a:pi + 1, b:pages.length}), W - PAD, fy + 32); }
    return cv;
  });
}

let histQ = '', histTrash = false;
function dayLabel(ts){
  const d = new Date(ts), n = new Date();
  const k = x => x.getFullYear() + '-' + x.getMonth() + '-' + x.getDate();
  if (k(d) === k(n)) return t('today');
  n.setDate(n.getDate() - 1);
  if (k(d) === k(n)) return t('yesterday');
  return fmtDate(ts);
}
function statusTags(items){
  const r = calc(items);
  if (!r.hasT) return '';
  if (!r.short && !r.over) return `<span class="tag ok">${esc(t('tOk'))}</span>`;
  return (r.short ? `<span class="tag short">${esc(t('fShort'))} ${r.short}</span>` : '') + (r.over ? `<span class="tag over">${esc(t('fOver'))} ${r.over}</span>` : '');
}

async function openHistory(){
  await persistNow();
  const all = await DB.all().catch(() => []);
  all.sort((a, z) => (z.updatedAt || 0) - (a.updatedAt || 0));
  const live = all.filter(b => !b.deleted), trash = all.filter(b => b.deleted);
  openSheet(`
    <div class="sh-title">${esc(t('hist'))}</div>
    <input id="hQ" type="search" autocomplete="off" placeholder="${esc(t('histSearch'))}" value="${esc(histQ)}">
    <div class="seg" id="hTabs"><button type="button" data-h="0" class="${histTrash?'':'on'}">${esc(t('hAll'))} ${live.length}</button><button type="button" data-h="1" class="${histTrash?'on':''}">🗑 ${esc(t('hTrash'))} ${trash.length}</button></div>
    <div id="hList"></div>
    <div class="hint${S.lastBackup ? '' : ' warn'}" style="margin:14px 2px 10px">${esc(S.lastBackup ? t('lastBackup', {d:fmtDT(S.lastBackup)}) : t('neverBackup'))}</div>
    <div class="sh-actions even"><button class="btn" id="hBackup">${esc(t('backup'))}</button><button class="btn" id="hImport">${esc(t('importB'))}</button></div>
    <div class="sh-actions one"><button class="btn primary" data-close>${esc(t('close'))}</button></div>
    <input type="file" id="hFile" accept=".json,application/json" hidden>`);
  const draw = () => {
    const q = histQ.trim().toLowerCase();
    const arr = (histTrash ? trash : live).filter(b => !q ||
      [b.bill, b.party, b.plate, b.note, ...b.items.map(i => i.name)].join(' ').toLowerCase().includes(q));
    let html = histTrash ? `<div class="hint" style="margin:0 2px 8px">${esc(t('trashNote'))}</div>` : '', last = '';
    arr.forEach(b => { const d = dayLabel(b.updatedAt); if (d !== last) { html += `<div class="hday">${esc(d)}</div>`; last = d; } html += histCard(b); });
    $('#hList').innerHTML = arr.length ? html : html + `<div class="hempty">${esc(t('histEmpty'))}</div>`;
  };
  $('#hQ').oninput = e => { histQ = e.target.value; draw(); };
  $('#hTabs').onclick = e => {
    const x = e.target.closest('[data-h]'); if (!x) return;

  $('#hBackup').onclick = doBackup;
  $('#hImport').onclick = () => $('#hFile').click();
  $('#hFile').onchange = e => { const f = e.target.files[0]; if (f) doImport(f); };
  draw();

async function doBackup(){
  await persistNow();
  const bills = await DB.all().catch(() => []);
  const data = {app:'GoodsCount', kind:'backup', version:APP_VERSION, exportedAt:new Date().toISOString(), bills};
  const f = new File([JSON.stringify(data)], `GoodsCount-backup-${stamp()}.json`, {type:'application/json'});
  let r = await shareFiles([f]);
  if (r === null) { download(f); r = true; }
  if (r) { S.lastBackup = Date.now(); save(); toast(t('backupDone', {n:bills.length})); if (sheetOpen && $('#hList')) openHistory(); }

async function doImport(file){
  try {
    const d = JSON.parse(await file.text());
    const arr = Array.isArray(d) ? d : d && d.bills;
    if (!Array.isArray(arr)) throw new Error('bad');
    let n = 0;
    for (const x of arr) {
      if (!x || typeof x.id !== 'string' || !Array.isArray(x.items) || x.id === S.billId) continue;
      const b = {id:x.id, bill:String(x.bill || ''), party:String(x.party || ''), plate:String(x.plate || ''), dir:['in','out'].includes(x.dir) ? x.dir : '',
        note:String(x.note || ''), createdAt:+x.createdAt || Date.now(), updatedAt:+x.updatedAt || Date.now(),
        items:x.items.filter(i => i && i.name != null).map(i => ({id:String(i.id || uid()), name:String(i.name), count:Math.max(0, parseInt(i.count, 10) || 0),
          target:i.target == null || i.target === '' ? null : Math.max(0, parseInt(i.target, 10) || 0), unit:String(i.unit || ''), pack:+i.pack > 1 ? parseInt(i.pack, 10) : null}))};
      if (x.deleted) b.deleted = +x.deleted || Date.now();
      const old = await DB.get(b.id).catch(() => null);
      if (!old || (old.updatedAt || 0) < b.updatedAt) { await dbq(() => DB.put(b)); n++; }
    }
    toast(t('importDone', {n}));
    openHistory();
  } catch(e) { toast(t('importBad')); }
}

    <div class="sec">📳 ${esc(t('vibSec'))}</div>
    <div class="stack"><button class="trow" type="button" data-t="vibrate">${esc(t('vibrate'))}<span class="pill${S.vibrate?' on':''}"></span></button></div>
    ${vibNote}
    <div class="lbl">${esc(t('vibLevel'))}</div>
    ${segOf('vibLevel', [[1,t('vLight')],[2,t('vNormal')],[3,t('vStrong')],[4,t('vMax')]])}
    <div class="lbl">${esc(t('mile'))}</div>
    ${segOf('mile', [[0,t('mOff')],[5,'5'],[10,'10'],[20,'20']])}
    <div class="lbl">${esc(t('tryIt'))}</div>
    <div class="tests" id="mTest">${[['up','xUp'],['down','xDown'],['mile','xMile'],['hit','xHit'],['over','xOver'],['err','xErr']].map(([k,l]) => `<button type="button" data-k="${k}">${esc(t(l))}</button>`).join('')}</div>
    <div class="hint">${esc(t('vibLegend'))}</div>

    <div class="sec">${esc(t('dataSec'))}</div>
    <div class="stack">
      <button class="trow" type="button" id="mReset">${esc(t('resetAll'))}</button>
      <button class="trow" type="button" id="mAbout">${esc(t('about'))}</button>
    </div>
    <div class="help">${['help1','help2','help3','help4','help5'].map(k => esc(t(k))).join('<br>')}</div>
    <div class="sh-actions" style="grid-template-columns:1fr;margin-top:14px"><button class="btn primary" data-close>${esc(t('done'))}</button></div>`);
  $('#mHist').onclick = openHistory;
  $('#mNew').onclick = () => { closeSheet(); newBill(); };
  $$('#mLang [data-lg]').forEach(b => b.onclick = () => {
    S.lang = b.dataset.lg; save(); applyLang(); render(); openMenu();
  });
  $$('.fopt[data-lf]').forEach(b => b.onclick = () => {
    S.laoFont = b.dataset.lf; save(); applyLang(); openMenu();
  });
  $$('[data-t]').forEach(b => b.onclick = () => {
    const k = b.dataset.t; S[k] = !S[k]; save();
    $('.pill', b).classList.toggle('on', S[k]);
    if (S[k]) fb('up');
  });
  $$('.seg[data-key]').forEach(sg => sg.onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const k = sg.dataset.key;
    S[k] = k === 'soundStyle' ? b.dataset.v : +b.dataset.v; save();
    $$('button', sg).forEach(x => x.classList.toggle('on', x === b));
    if (k === 'soundStyle') beep('hit');
    else if (k === 'vibLevel') vib('hit');
    else if (S.mile) fb('mile');
  });
  $('#mVol').oninput = e => { S.volume = +e.target.value; $('#mVolV').textContent = S.volume + '%'; save(); };
  $('#mVol').onchange = () => beep('up');
  $('#mTest').onclick = e => { const b = e.target.closest('[data-k]'); if (b) fb(b.dataset.k); };
  $('#mAbout').onclick = openAbout;
  $('#mReset').onclick = async () => {
    if (!(await ask(t('resetTitle'), t('resetMsg'), t('resetOk')))) return;
    closeSheet();
    snap(); S.items.forEach(i => i.count = 0); dirty(); render(); toast(t('resetDone'), {label:t('undo'), fn:undo});
  };
}

/* ================= list interactions ================= */
const list = $('#list');
let suppress = false;

list.addEventListener('click', e => {
  if (suppress) return;
  const row = e.target.closest('.row');
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'demo') { loadDemo(); return; }
  if (!row) return;
  const id = row.dataset.id;
  if (openId && act !== 'del') { setOpen(null); if (!act) return; }
  if (act === 'del')  { deleteItem(id); return; }
  if (act === 'inc')  { S.activeId = id; changeCount(id, +1); return; }
  if (act === 'dec')  { S.activeId = id; changeCount(id, -1); return; }
  if (act === 'edit') { openEdit(id); return; }
  setActive(id);
});

function setOpen(id){
  openId = id;
  $$('.row', list).forEach(r => { r.classList.toggle('open', r.dataset.id === id); r.classList.remove('peek'); });
}

let drag = null;
list.addEventListener('pointerdown', e => {
  const front = e.target.closest('.front');
  if (!front || e.target.closest('button')) return;
  const row = front.parentElement;
  drag = {row, front, id:row.dataset.id, x:e.clientX, y:e.clientY, pid:e.pointerId,
          base: openId === row.dataset.id ? OPEN_W : 0, moving:false, off:0};
});
list.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moving) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      drag.moving = true; drag.front.classList.add('dragging'); drag.row.classList.add('peek');
      try{ drag.front.setPointerCapture(e.pointerId); }catch(_){}
    } else return;
  }
  drag.off = Math.min(OPEN_W + 24, Math.max(0, drag.base + dx));
  drag.front.style.transform = `translateX(${drag.off}px)`;
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moving) return;
  suppress = true; setTimeout(() => suppress = false, 80);
  d.front.classList.remove('dragging');
  d.front.style.transform = '';
  setOpen(d.off > OPEN_W / 2 ? d.id : null);
  if (d.off > OPEN_W / 2 && S.vibrate && navigator.vibrate) navigator.vibrate(8);
}
list.addEventListener('pointerup', endDrag);
list.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (openId && !e.target.closest('.row, [data-hap]')) setOpen(null); });

/* ================= bindings ================= */
$('#btnHist').innerHTML = ICON.hist;
$('#btnSum').innerHTML = ICON.check;
$('#btnMenu').innerHTML = ICON.menu;
$('#addBtn').innerHTML = ICON.plus + '<span id="addLab"></span>';
$('#undo').innerHTML = ICON.undo + '<span id="undoLab"></span>';

$('#addBtn').onclick = openAdd;
$('#btnHist').onclick = openHistory;
$('#btnSum').onclick = openSummary;
$('#btnMenu').onclick = openMenu;
$('#billLine').onclick = openBillInfo;
$('#undo').onclick = undo;
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  S.filter = b.dataset.f; save(); render();
});
$('#steps').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  S.step = b.dataset.s === 'p' ? 'p' : +b.dataset.s; save(); renderDock();
});
$('#now').onclick = () => {
  const row = $(`.row[data-id="${S.activeId}"]`);
  if (row) row.scrollIntoView({block:'center', behavior:'smooth'}); else nudge();
};
[['#bMinus',-1],['#bPlus',1]].forEach(([sel, dir]) => {
  const b = $(sel);
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(dir); });
  b.addEventListener('click', e => { if (e.detail === 0) press(dir); }); // keyboard
});
$('#dock').addEventListener('contextmenu', e => e.preventDefault());

function loadDemo(){
  snap();
  const mk = (name, target, unit, pack) => ({id:uid(), name, count:0, target, unit, pack:pack || null});
  const sets = {
    en:[mk('Drinking water 600ml',24,'pack'), mk('Rice 5kg',10,'bag'), mk('Soda can',48,'can',24), mk('Cement',40,'bag')],
    th:[mk('น้ำดื่ม 600ml',24,'แพ็ค'), mk('ข้าวสาร 5kg',10,'ถุง'), mk('น้ำอัดลม กระป๋อง',48,'กระป๋อง',24), mk('ปูนซีเมนต์',40,'ถุง')],
    lo:[mk('ນ້ຳດື່ມ 600ml',24,'ແພັກ'), mk('ເຂົ້າສານ 5kg',10,'ຖົງ'), mk('ນ້ຳອັດລົມ ກະປ໋ອງ',48,'ກະປ໋ອງ',24), mk('ຊີມັງ',40,'ຖົງ')]
  };
  S.items = sets[S.lang] || sets.en;
  S.activeId = S.items[0].id; if (!S.bill) S.bill = 'DEMO-001';
  dirty(); render();
}

/* dock height -> CSS var (so the list never hides behind the dock) */
const dock = $('#dock');
const setDockH = () => document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
if ('ResizeObserver' in window) new ResizeObserver(setDockH).observe(dock);
window.addEventListener('resize', setDockH);

/* keep the screen on while counting */
let wl = null;
async function keepAwake(){
  try{ if ('wakeLock' in navigator && document.visibilityState === 'visible') wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', () => { if (!wl || wl.released) keepAwake(); }, {passive:true});
keepAwake();

/* PWA (works when hosted over https; harmless when opened as a local file) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

save();
if (!isBlank(curBill())) persistNow();   // make sure the bill in progress is in History too
applyLang(); render(); setDockH(); probeExtras();
})();
</script>
